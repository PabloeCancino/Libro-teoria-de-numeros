[book]
title = "Teoría de Números"
authors = ["Pablo Eduardo Cancino Marentes"]
description = "Texto de Teoría de Números para la Licenciatura en Matemáticas, basado en el programa del Plan de Estudios 2024 (PALMAT) de la Universidad Autónoma de Nayarit."
language = "es"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
mathjax-support = true
git-repository-url = "https://github.com/PabloeCancino/Libro-teoria-de-numeros"
site-url = "/Libro-teoria-de-numeros/"

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true

[output.html.fold]
enable = true
level = 1

[output.html.print]
enable = true
